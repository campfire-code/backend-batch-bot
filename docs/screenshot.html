<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>后台批量操作机器人</title><style>
*{box-sizing:border-box}body{margin:0;width:1040px;height:700px;background:#f4f5f7;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#1d2129;padding:36px}
.card{background:#fff;border-radius:20px;height:628px;padding:40px 48px;box-shadow:0 2px 14px rgba(0,0,0,.06);position:relative;display:flex;flex-direction:column}
.brand{position:absolute;right:32px;top:24px;font-size:13px;color:#8a919c}
h1{margin:0 0 12px;font-size:36px;font-weight:700}
.desc{font-size:16px;line-height:1.6;color:#4e5560;margin:0 0 22px}
h2{font-size:15px;color:#ff6a1a;margin:0 0 10px;letter-spacing:1px}
ol{margin:0;padding:0;list-style:none;counter-reset:n}
li{counter-increment:n;display:flex;gap:14px;font-size:16px;line-height:1.55;margin-bottom:12px}
li:before{content:counter(n);flex:none;width:26px;height:26px;border-radius:50%;background:#fff1e8;color:#ff6a1a;font-weight:700;font-size:14px;text-align:center;line-height:26px;margin-top:1px}
.fmt{margin-top:auto;background:#f4f5f7;border-radius:12px;padding:14px 18px;font-size:14px;line-height:1.5;color:#4e5560}.fmt b{color:#1d2129}
</style><body><div class="card"><div class="brand">篝火出品</div><h1>后台批量操作机器人</h1><p class="desc">用大白话描述要做的事，它看着屏幕自己点、自己填，把网页后台里重复的操作交给机器。</p><h2>怎么用</h2><ol><li><span>准备一个能看图的多模态大模型，填入接口地址、密钥、模型名和模型系列</span></li><li><span>安装 Chrome 插件（或 Studio 桌面版），粘贴模型配置</span></li><li><span>打开要操作的后台页面，输入一句话，例如“点开第一条订单并改成已发货”</span></li><li><span>重复流程可写成 YAML 脚本，用命令行运行并生成可回放的报告</span></li></ol><div class="fmt"><b>交付形式　</b>Windows .exe、Mac .dmg（Studio 公测版）与 Chrome 插件 zip；需要自备大模型接口，界面以英文为主</div></div></body></html>

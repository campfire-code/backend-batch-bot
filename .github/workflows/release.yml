# 篝火：打 v*-campfire.* 标签时转发布上游官方安装包（流程定义在 campfire-code/toolkit-hub）
name: release
on:
  push:
    tags: ['v*-campfire.*']
permissions:
  contents: write
jobs:
  release:
    uses: campfire-code/toolkit-hub/.github/workflows/mirror-release.yml@v1
    with:
      # 排除更新清单、blockmap、Studio 的 zip 重复包（保留 dmg / setup.exe 与浏览器插件 zip）、Linux 版
      exclude: '\.(sig|json|yml|blockmap)$|^Source code|^midscene-studio-beta-.*\.zip$'
